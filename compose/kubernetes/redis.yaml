apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: redis  # Changed to 'app' for more conventional labeling
  namespace: production
  name: redis
spec:
  replicas: 1  # Number of replicas for redundancy
  selector:
    matchLabels:
      app: redis  # Ensure this matches the label in the template
  strategy: {}  # You can specify deployment strategies if needed
  template:
    metadata:
      labels:
        app: redis  # Consistent label for pod selection
    spec:
      containers:
      - image: redis:5.0  # Redis image
        name: redis
        ports:  # Expose the container's port
        - containerPort: 6379  # Default Redis port
      restartPolicy: Always  # Always restart the container if it fails
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: redis  # Changed to 'app' for consistency
  namespace: production
  name: redis
spec:
  ports:
  - name: redis  # Give the port a name for clarity
    protocol: TCP
    port: 6379  # Service port
    targetPort: 6379  # Port on the container
  selector:
    app: redis  
